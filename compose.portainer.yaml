# Build and push the verified image to your own registry first.
# Set STORAGE_IMAGE to that immutable tag or digest in Portainer.
services:
  app:
    image: ${STORAGE_IMAGE:?Set the published Storage System image}
    ports:
      - "${STORAGE_PORT:-3210}:3210"
    environment:
      STORAGE_ADMIN_KEY: ${STORAGE_ADMIN_KEY:?Set a separate management key}
      STORAGE_API_KEY: ${STORAGE_API_KEY:?Set a public read API key}
      APP_BASE_URL: ${APP_BASE_URL:?Set the browser and HA accessible application URL}
      # Optional: the label service and this system's client key. Settings saved in the app take precedence.
      LABEL_SERVICE_URL: ${LABEL_SERVICE_URL:-}
      LABEL_SERVICE_KEY: ${LABEL_SERVICE_KEY:-}
    volumes:
      - app-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  app-data:
