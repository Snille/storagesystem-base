<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#95c200" stroke-width=".6" opacity=".25"/>
    </pattern>
    <pattern id="coarse" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#fine)"/>
      <path d="M100 0 H0 V100" fill="none" stroke="#95c200" stroke-width="1.2" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#0f1a12"/>
  <rect width="1600" height="900" fill="url(#coarse)"/>
  <!-- A shelving unit drawn like a technical drawing, with boxes and dimension lines. -->
  <g fill="none" stroke="#b6e04a" stroke-width="2.5" opacity=".7">
    <path d="M1000 160 v600 M1460 160 v600 M1000 160 h460 M1000 310 h460 M1000 460 h460 M1000 610 h460 M1000 760 h460"/>
    <rect x="1030" y="210" width="120" height="100"/><rect x="1170" y="230" width="130" height="80"/><rect x="1320" y="200" width="110" height="110"/>
    <rect x="1030" y="370" width="180" height="90"/><rect x="1230" y="380" width="200" height="80"/>
    <rect x="1030" y="520" width="110" height="90"/><rect x="1160" y="530" width="110" height="80"/><rect x="1290" y="510" width="140" height="100"/>
  </g>
  <g fill="none" stroke="#95c200" stroke-width="1.5" opacity=".6">
    <path d="M1000 120 h460 M1000 110 v20 M1460 110 v20 M960 160 v600 M950 160 h20 M950 760 h20"/>
  </g>
  <g fill="#95c200" opacity=".6" font-family="monospace" font-size="22">
    <text x="1190" y="105">1200</text><text x="880" y="470">2000</text>
  </g>
</svg>
